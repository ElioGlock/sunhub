name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas gráficas para o Qt (testes offscreen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: pip install -e ".[app,dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
